name: Termux Android ARM64 bundle

on:
  push:
    branches:
      - "termux/android-arm64"
    paths:
      - "bin/**"
      - "lib/**"
      - "data/**"
      - "verbs/**"
      - "tips/**"
      - "scripts/**"
      - "prompts/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "README-TERMUX.md"
      - "install-termux.sh"
      - "uninstall-termux.sh"
      - ".github/workflows/termux-aarch64.yml"
  pull_request:
    paths:
      - "bin/**"
      - "lib/**"
      - "data/**"
      - "verbs/**"
      - "tips/**"
      - "scripts/**"
      - "prompts/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "README-TERMUX.md"
      - "install-termux.sh"
      - "uninstall-termux.sh"
      - ".github/workflows/termux-aarch64.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    name: Test and package Termux ARM64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Checkout upstream Codex 0.169.0 TUI source
        uses: actions/checkout@v4
        with:
          repository: openai/codex
          ref: rust-v0.169.0
          path: upstream-codex
          sparse-checkout: |
            codex-rs/tui/src
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - name: Audit upstream Codex UI translations
        run: |
          mkdir -p dist
          node scripts/audit-upstream.js upstream-codex dist/translation-audit-0.169.0.md

      - name: Check JavaScript syntax
        run: |
          node --check scripts/audit-upstream.js
          node --check bin/codex-zh.js
          node --check bin/codex-zh-language.js
          node --check bin/codex-zh-doctor.js

      - name: Validate translation data
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Download and unpack Android ARM64 PTY prebuild
        run: |
          set -euo pipefail
          TARBALL="$(npm pack --silent @mmmbuto/node-pty-android-arm64@1.1.2)"
          mkdir -p node_modules/node-pty
          tar -xzf "$TARBALL" --strip-components=1 -C node_modules/node-pty
          rm -f "$TARBALL"

      - name: Check installer shell syntax
        run: bash -n install-termux.sh uninstall-termux.sh

      - name: Verify Android native module checksum
        shell: bash
        run: |
          set -euo pipefail
          PTY="node_modules/node-pty/prebuilds/android-arm64/pty.node"
          test -s "$PTY"
          echo "660a3025230f6035b7b8c000e8cca6ca3992bedaa05f7b165e7c3a5f1ae8ec8a  $PTY" | sha256sum --check
          mkdir -p dist
          echo "660a3025230f6035b7b8c000e8cca6ca3992bedaa05f7b165e7c3a5f1ae8ec8a  node_modules/node-pty/prebuilds/android-arm64/pty.node" > dist/PTY-SHA256SUMS

      - name: Assemble portable Termux bundle
        run: |
          set -euo pipefail
          BUNDLE="codex-code-zh-cn-termux-aarch64"
          mkdir -p "dist/$BUNDLE"
          tar --exclude='./.git' --exclude='./.github' --exclude='./dist' --exclude='./upstream-codex' \
            -cf - . | tar -xf - -C "dist/$BUNDLE"
          cp dist/PTY-SHA256SUMS "dist/$BUNDLE/PTY-SHA256SUMS"
          cp dist/translation-audit-0.169.0.md "dist/$BUNDLE/TRANSLATION-AUDIT-0.169.0.md"

      - name: Upload Termux ARM64 bundle
        uses: actions/upload-artifact@v4
        with:
          name: codex-code-zh-cn-termux-aarch64
          path: dist/codex-code-zh-cn-termux-aarch64/
          if-no-files-found: error
          retention-days: 30
