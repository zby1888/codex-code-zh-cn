name: Native Codex Android ARM64 Chinese

on:
  push:
    branches:
      - "native/android-arm64"
    paths:
      - "native/**"
      - "README-NATIVE-TERMUX.md"
      - ".github/workflows/native-android-arm64.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-codex-android-arm64
  cancel-in-progress: true

jobs:
  build:
    name: Build native Chinese Codex 0.169.0 for Termux ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout localization repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout pinned Termux package build system
        uses: actions/checkout@v4
        with:
          repository: termux/termux-packages
          ref: 1d8cc3f98c8a685f3a1475becbb0fe7d7dcda7fd
          path: termux-packages
          persist-credentials: false
          fetch-depth: 1

      - name: Verify pinned upstream build recipe
        shell: bash
        run: |
          set -euo pipefail
          cd termux-packages
          grep -Fq 'TERMUX_PKG_VERSION="0.169.0"' packages/codex/build.sh
          grep -Fq 'TERMUX_PKG_SRCURL="https://github.com/openai/codex/archive/refs/tags/rust-v$TERMUX_PKG_VERSION.tar.gz"' packages/codex/build.sh
          grep -Fq 'TERMUX_PKG_SHA256=d9b6335151f66d1d4ae9123f55553164ff339f30b14f64a358ea78139c4c093e' packages/codex/build.sh
          test "$(git rev-parse HEAD)" = "1d8cc3f98c8a685f3a1475becbb0fe7d7dcda7fd"
          echo "Termux package builder commit: $(git rev-parse HEAD)"
          echo "Codex source: openai/codex rust-v0.169.0"

      - name: Stage native localization patches
        shell: bash
        run: |
          set -euo pipefail
          PATCH_COUNT="$(find "$GITHUB_WORKSPACE/native/patches/codex" -maxdepth 1 -type f -name '*.patch' | wc -l | tr -d ' ')"
          test "$PATCH_COUNT" -eq 6
          cp "$GITHUB_WORKSPACE"/native/patches/codex/*.patch termux-packages/packages/codex/
          printf 'Staged %s Codex localization patch(es)\n' "$PATCH_COUNT"

      - name: Reclaim runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Check Docker availability
        run: docker info

      - name: Build with the official Termux package builder
        shell: bash
        run: |
          set -euo pipefail
          cd termux-packages
          ./scripts/run-docker.sh bash -c 'cd /home/builder/termux-packages && export TERMUX_PKG_MAKE_PROCESSES=2 && ./build-package.sh -I codex'

      - name: Extract, verify and package native Chinese ARM64 binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/root dist/codex-native-termux-aarch64-zh
          deb="$(find termux-packages/output -maxdepth 1 -type f -name 'codex_*_aarch64.deb' -print -quit)"
          test -n "$deb"
          dpkg-deb --info "$deb"
          dpkg-deb -x "$deb" dist/root

          codex_bin="$(find dist/root -type f -path '*/bin/codex' -print -quit)"
          helper_bin="$(find dist/root -type f -name 'codex-code-mode-host' -print -quit)"
          test -n "$codex_bin"
          test -n "$helper_bin"

          OUT="dist/codex-native-termux-aarch64-zh"
          cp "$codex_bin" "$OUT/codex"
          cp "$helper_bin" "$OUT/codex-code-mode-host"
          cp "$GITHUB_WORKSPACE/native/install-termux.sh" "$OUT/install-termux.sh"
          cp "$GITHUB_WORKSPACE/native/uninstall-termux.sh" "$OUT/uninstall-termux.sh"
          cp "$GITHUB_WORKSPACE/native/README-INSTALL-TERMUX.md" "$OUT/README-INSTALL-TERMUX.md"
          chmod 0700 "$OUT/codex" "$OUT/codex-code-mode-host"
          chmod 0755 "$OUT/install-termux.sh" "$OUT/uninstall-termux.sh"

          file "$OUT/codex" "$OUT/codex-code-mode-host"
          readelf -h "$OUT/codex" | grep -F 'AArch64'
          readelf -h "$OUT/codex-code-mode-host" | grep -F 'AArch64'

          python3 - "$OUT/codex" <<'PY'
          from pathlib import Path
          import sys
          binary = Path(sys.argv[1]).read_bytes()
          required = [
              "欢迎使用 ",
              "选择模型和推理强度",
              "右键粘贴",
              "正在加载服务器实验功能",
              "其他登录方式",
              "使用自己的 OpenAI API 密钥",
              "让 Codex 帮你完成任何任务",
              "模型服务商",
              "推理强度",
              "速度最快的推理模式，但会增加套餐用量",
              "管理网络安全工作所需的更广泛访问权限",
              "自定义模型服务商已配置",
              "Token 用量",
              "选择具体模型和推理强度",
          ]
          missing = [item for item in required if item.encode("utf-8") not in binary]
          if missing:
              raise SystemExit("Native Chinese localization verification failed; missing: " + ", ".join(missing))
          print("Verified native Chinese strings:", ", ".join(required))
          PY

          PATCH_COUNT="$(find "$GITHUB_WORKSPACE/native/patches/codex" -maxdepth 1 -type f -name '*.patch' | wc -l | tr -d ' ')"
          test "$PATCH_COUNT" -eq 6
          SHORT_SHA="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          INSTALL_VERSION="0.169.0-zh-$SHORT_SHA"
          {
            echo "Upstream: openai/codex"
            echo "Upstream tag: rust-v0.169.0"
            echo "Target: aarch64-linux-android"
            echo "Minimum Android API: 24"
            echo "Termux build system commit: 1d8cc3f98c8a685f3a1475becbb0fe7d7dcda7fd"
            echo "Package: $(basename "$deb")"
            echo "Build type: native-patched Chinese source build"
            echo "Localization patches: $PATCH_COUNT"
            echo "Install version: $INSTALL_VERSION"
            echo "Localization source commit: $GITHUB_SHA"
          } > "$OUT/BUILD-METADATA.txt"

          (
            cd "$OUT"
            sha256sum codex codex-code-mode-host install-termux.sh uninstall-termux.sh BUILD-METADATA.txt > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Upload native Chinese Termux ARM64 package
        uses: actions/upload-artifact@v4
        with:
          name: codex-native-termux-aarch64-zh
          path: dist/codex-native-termux-aarch64-zh/
          if-no-files-found: error
          retention-days: 30
